name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generated pages are up to date
        run: |
          python3 build.py
          if ! git diff --exit-code -- lessons assets/js/search-index.js; then
            echo "::error::lessons/ or search-index.js is stale. Run 'python3 build.py' and commit the result."
            exit 1
          fi

      - name: JavaScript syntax
        run: for f in assets/js/*.js; do node --check "$f"; done

      - name: Install test tooling
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: HTML validation
        run: npm run validate

      - name: End-to-end, accessibility and AI tutor tests
        run: npm test
